<style>
  :root {
    --bg1: #fdf3e7;
    --bg2: #f6dcc8;
    --card: #fffaf4;
    --accent: #e0694a;
    --accent-dark: #c4502f;
    --accent-soft: #fde3d8;
    --teal: #2f8f8a;
    --text: #3d2f27;
    --muted: #8c7666;
    --line: #f0dfd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 15% 10%, #fff8ef 0%, transparent 45%),
      radial-gradient(circle at 90% 95%, #f3cdb5 0%, transparent 50%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    padding: 1rem;
  }
  .card {
    background: var(--card);
    border-radius: 32px;
    padding: 1.6rem 1.6rem 1.8rem;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 24px 60px rgba(120, 70, 40, 0.18),
      0 4px 14px rgba(120, 70, 40, 0.08);
    position: relative;
    overflow: hidden;
  }
  .card.jackpot::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 32px;
    padding: 4px;
    background: conic-gradient(from var(--angle, 0deg), #e0694a, #f7b267, #2f8f8a, #f28fa8, #e0694a);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: spinBorder 3s linear infinite;
    pointer-events: none;
  }
  @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spinBorder { to { --angle: 360deg; } }

  h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .sub {
    margin: .2rem 0 1rem;
    color: var(--muted);
    font-weight: 600;
  }

  .scene {
    border-radius: 24px;
    margin-bottom: 1.2rem;
    background:
      radial-gradient(ellipse at 50% 30%, #fffdf9 0%, #fbeee2 60%, #f4dccb 100%);
    box-shadow: inset 0 -10px 30px rgba(196, 120, 80, .12);
    overflow: hidden;
  }
  svg.stage {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Katze: Idle-Bewegungen */
  .tail {
    transform-box: view-box;
    transform-origin: 108px 222px;
    animation: swish 3.2s ease-in-out infinite;
  }
  @keyframes swish {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-7deg); }
  }
  .torso {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.025); }
  }
  .head {
    transform-box: view-box;
    transform-origin: 300px 185px;
    transition: transform .5s ease;
  }
  .stage.bliss .head { transform: rotate(-5deg); }
  .eyes-closed { opacity: 0; transition: opacity .25s; }
  .eyes-open { opacity: 1; transition: opacity .25s; }
  .stage.bliss .eyes-open { opacity: 0; }
  .stage.bliss .eyes-closed { opacity: 1; }
  .blush { opacity: .45; transition: opacity .4s; }
  .stage.bliss .blush { opacity: .85; }

  /* Zonen */
  .zone { opacity: 0; transition: opacity .25s ease; }
  .zone.peek { opacity: .55; transition: opacity .05s; }
  .zone.active { opacity: 1; }
  .ring {
    transform-box: fill-box;
    transform-origin: center;
  }
  .zone.active .ring { animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse {
    0% { transform: scale(.6); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* Hände */

  .card.jackpot .chip .num { background: #fff; color: var(--accent); }
  @keyframes pop {
    from { transform: scale(.6); opacity: 0; }

    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const breath = c.createBufferSource(); breath.buffer = nb;
    const breathAmt = c.createGain(); breathAmt.gain.value = 0.06;
    breath.connect(breathAmt);

    // Mund: m → i → a → ou
    const vowel = c.createGain();
    const formants = [
      { f: [300, 850, 1000, 520], q: 4,  g: 1.0 },
      { f: [2500, 1850, 1450, 950], q: 7, g: 0.55 },
      { f: [3300, 3000, 2800, 2500], q: 10, g: 0.22 }
    ];
    const times = [0, 0.18, 0.42, 0.8];
    formants.forEach(fm => {
      const bp = c.createBiquadFilter();
      bp.type = "bandpass"; bp.Q.value = fm.q;
      bp.frequency.setValueAtTime(fm.f[0], T(times[0]));
      for (let i = 1; i < times.length; i++) bp.frequency.linearRampToValueAtTime(fm.f[i], T(times[i]));
      const g = c.createGain(); g.gain.value = fm.g;
      osc.connect(bp); breathAmt.connect(bp);
      bp.connect(g).connect(vowel);
    });

    // Nasaler Beginn: Klang öffnet sich, am Ende schließt er sich wieder
    const lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(400, T(0));
    lp.frequency.exponentialRampToValueAtTime(6000, T(0.11));
    lp.frequency.setValueAtTime(6000, T(0.6));
    lp.frequency.exponentialRampToValueAtTime(1800, T(dur));

    const out = c.createGain();
    out.gain.setValueAtTime(0.0001, T(0));
    out.gain.exponentialRampToValueAtTime(0.5, T(0.09));
    out.gain.linearRampToValueAtTime(0.58, T(0.3));
    out.gain.linearRampToValueAtTime(0.4, T(0.62));
    out.gain.exponentialRampToValueAtTime(0.0001, T(dur));

    vowel.connect(lp).connect(out).connect(c.destination);
    [osc, vib, breath].forEach(s => { s.start(T(0)); s.stop(T(dur + 0.05)); });
  }

  function purr(c, t0, dur) {
    stopPurr();
    const len = Math.floor(c.sampleRate * 1);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const lp = c.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 380;
    lp.Q.value = 1.5;

    // Brummen: schnelles Pulsieren (~25 Hz)
    const pulse = c.createGain();
    pulse.gain.value = 0.5;
    const lfo = c.createOscillator();
    lfo.frequency.value = 25;
    const lfoAmt = c.createGain();
    lfoAmt.gain.value = 0.5;
    lfo.connect(lfoAmt).connect(pulse.gain);

    // Ein- und Ausatmen
    const env = c.createGain();
    const end = t0 + dur;
    env.gain.setValueAtTime(0.0001, t0);
    let t = t0;
    let inhale = true;
    while (t < end - 0.4) {
      const seg = inhale ? 0.9 : 1.1;
      env.gain.linearRampToValueAtTime(inhale ? 0.9 : 1.2, Math.min(t + 0.25, end));
      env.gain.linearRampToValueAtTime(0.25, Math.min(t + seg, end));
      t += seg;
      inhale = !inhale;
    }
    env.gain.linearRampToValueAtTime(0.0001, end);

    noise.connect(lp).connect(pulse).connect(env).connect(c.destination);
    noise.start(t0); lfo.start(t0);
    noise.stop(end + 0.05); lfo.stop(end + 0.05);
    purrNodes = { noise, lfo, env };
  }

  function stopPurr() {
    if (!purrNodes || !ctx) return;
    const now = ctx.currentTime;
    try {
      purrNodes.env.gain.cancelScheduledValues(now);
      purrNodes.env.gain.setValueAtTime(purrNodes.env.gain.value, now);
      purrNodes.env.gain.linearRampToValueAtTime(0.0001, now + 0.15);
      purrNodes.noise.stop(now + 0.2);
      purrNodes.lfo.stop(now + 0.2);
    } catch (e) {}
    purrNodes = null;
  }

  function catSounds(jackpot) {
    if (MEOW_ENABLED) {
      bubble.classList.add("show");
      setTimeout(() => bubble.classList.remove("show"), 1400);
    }
    if (!soundOn || !ctx) return;
    const t = ctx.currentTime + 0.05;
    if (MEOW_ENABLED) meow(ctx, t);
    purr(ctx, t + (MEOW_ENABLED ? 0.85 : 0), jackpot ? 5 : 3.2);
  }

  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    try { localStorage.setItem("mr-sound", soundOn ? "on" : "off"); } catch (e) {}
    if (soundOn) audio(); else stopPurr();
  });

  // Gleiche Wahrscheinlichkeiten wie im Original
  function getCount() {
    const r = Math.random() * 100;
    if (r < 2.5) return 5;
    if (r < 10) return 4;
    if (r < 25) return 3;
    if (r < 50) return 2;
    return 1;
  }

  function pick(count) {
    const indices = [0, 1, 2, 3, 4];
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices.slice(0, count).sort((a, b) => a - b);
  }

  function el(id) { return document.getElementById(id); }

  function reset() {
    for (let i = 0; i < 5; i++) {
      el(`hand-${i}`).classList.remove("active");
      el(`zone-${i}`).classList.remove("active", "peek");
      el(`label-${i}`).classList.remove("active");
    }
    stage.classList.remove("bliss");
    card.classList.remove("jackpot");
  }

  function spawnHearts(n) {
    if (reduceMotion) return;
    for (let k = 0; k < n; k++) {
      const g = document.createElementNS(SVGNS, "g");
      const x = 335 + Math.random() * 45;
      const y = 80 + Math.random() * 25;
      g.setAttribute("transform", `translate(${x} ${y}) scale(${0.8 + Math.random() * 0.7})`);
      const use = document.createElementNS(SVGNS, "use");
      use.setAttribute("href", "#heartShape");
      use.setAttribute("class", "heart");
      use.setAttribute("fill", ["#f28fa8", "#e0694a", "#f7b267"][k % 3]);
      use.style.animationDelay = `${k * 0.12}s`;
      g.appendChild(use);
      heartsEl.appendChild(g);
      setTimeout(() => g.remove(), 2200 + k * 120);
    }
  }

  function shuffleAnimation() {
    return new Promise(resolve => {
      if (reduceMotion) return resolve();
      const delays = [60, 60, 70, 80, 90, 110, 130, 160, 200];
      let step = 0, last = -1;
      const tick = () => {
        if (last >= 0) el(`zone-${last}`).classList.remove("peek");
        if (step >= delays.length) return resolve();
        let next;
        do { next = Math.floor(Math.random() * 5); } while (next === last);
        el(`zone-${next}`).classList.add("peek");
        last = next;
        setTimeout(tick, delays[step++]);
      };
      tick();
    });
  }

  function render(chosen) {
    const count = chosen.length;
    const jackpot = count === 5;

    let title, sub;
    if (jackpot) { title = "Jackpot! Alle fünf."; sub = "Das volle Verwöhnprogramm"; }
    else if (count === 1) { title = "1 Massage"; sub = "Klein, aber fein"; }
    else { title = `${count} Massagen`; sub = count >= 3 ? "Heute läuft's" : "Doppelt hält besser"; }

    resultsEl.innerHTML = "";
    const head = document.createElement("div");
    head.className = "headline";
    head.innerHTML = `${title}<small>${sub}</small>`;
    resultsEl.appendChild(head);

    const chips = document.createElement("div");
    chips.className = "chips";
    chosen.forEach((idx, n) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.style.animationDelay = `${n * 0.12}s`;
      chip.innerHTML = `<span class="num">${n + 1}</span>${massages[idx]}`;
      chips.appendChild(chip);
    });
    resultsEl.appendChild(chips);

    chosen.forEach((idx, n) => {
      setTimeout(() => {
        el(`zone-${idx}`).classList.add("active");
        el(`hand-${idx}`).classList.add("active");
        el(`label-${idx}`).classList.add("active");
      }, reduceMotion ? 0 : n * 120);
    });

    stage.classList.add("bliss");
    if (jackpot) card.classList.add("jackpot");
    catSounds(jackpot);
    spawnHearts(jackpot ? 12 : 3 + count);
  }

  async function roll() {
    if (rolling) return;
    rolling = true;
    rollBtn.disabled = true;
    rollBtn.classList.add("rolling");
    if (soundOn) audio(); // muss direkt im Tipp passieren (iPhone)
    stopPurr();
    bubble.classList.remove("show");
    reset();

    const chosen = pick(getCount());
    await shuffleAnimation();
    render(chosen);

    rollBtn.disabled = false;
    rollBtn.classList.remove("rolling");
    rolling = false;
  }

  rollBtn.addEventListener("click", roll);
</script>
